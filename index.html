<!DOCTYPE html>

<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Audio Studio</title>

<style>

*{box-sizing:border-box}

body{

 margin:0;min-height:100vh;padding:25px 16px;

 background:#101014;color:#f5f3fa;

 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

 display:flex;justify-content:center;align-items:center

}

.app{width:100%;max-width:480px}

.logo{font-size:14px;color:#a78bfa;font-weight:700;letter-spacing:2px}

h1{font-size:34px;margin:12px 0 8px}

.sub{color:#9995a5;margin:0 0 28px;line-height:1.5}

.panel{background:#1b1a22;border:1px solid #302d3a;border-radius:22px;padding:22px}

.drop{

 border:2px dashed #51446e;border-radius:16px;padding:30px 15px;

 text-align:center;background:#211d2b;cursor:pointer

}

.drop strong{display:block;font-size:17px;margin:12px 0 7px}

.drop span{font-size:13px;color:#a9a3b5}

input[type=file]{display:none}

.icon{font-size:35px}

label{display:block;color:#c7c2d0;font-size:14px;margin:22px 0 9px}

select{

 width:100%;padding:14px;border-radius:12px;

 background:#292631;color:white;border:1px solid #494353;font-size:15px

}

button{

 width:100%;border:0;border-radius:13px;padding:16px;

 background:linear-gradient(100deg,#8b5cf6,#6d48cf);

 color:white;font-weight:700;font-size:16px;margin-top:20px;cursor:pointer

}

button:disabled{opacity:.45;cursor:not-allowed}

.status{font-size:13px;color:#b6b0c2;margin-top:18px;min-height:20px}

.track{height:8px;background:#34313c;border-radius:20px;margin-top:12px;overflow:hidden}

.bar{height:100%;width:0;background:#a78bfa;transition:width .2s}

.result{display:none;margin-top:18px;padding:15px;border-radius:13px;background:#292338}

.result a{color:#c4aaff;font-weight:700;text-decoration:none}

.small{font-size:12px;color:#817c8c;text-align:center;margin-top:22px;line-height:1.5}

</style>

</head>

<body>

<main class="app">

 <div class="logo">AUDIO STUDIO</div>

 <h1>Dein Sound.<br>Dein Format.</h1>

 <p class="sub">Einfach MP4 in MP3 umwandeln. Kostenlos, direkt im Browser.</p>

 <section class="panel">

  <label for="file" class="drop">

   <div class="icon">♫</div>

   <strong id="fileTitle">MP4-Datei auswählen</strong>

   <span id="fileInfo">Tippe hier, um eine Videodatei auszuwählen</span>

  </label>

  <input id="file" type="file" accept="video/*,.mp4">

  <label for="quality">MP3-Qualität</label>

  <select id="quality">

   <option value="128k">128 kbps – Kleine Datei</option>

   <option value="192k" selected>192 kbps – Gute Qualität</option>

   <option value="320k">320 kbps – Beste Qualität</option>

  </select>

  <button id="convert" disabled>In MP3 umwandeln</button>

  <div class="status" id="status">Bitte zuerst eine Datei auswählen.</div>

  <div class="track"><div class="bar" id="bar"></div></div>

  <div class="result" id="result">

   <div style="margin-bottom:10px">✓ Deine MP3 ist fertig!</div>

   <a id="download" href="#">MP3 herunterladen ↓</a>

  </div>

 </section>

 <p class="small">Deine Dateien werden lokal in deinem Browser verarbeitet.<br>Keine Anmeldung. Kein Abo.</p>

</main>

<script type="module">

const fileInput=document.getElementById('file');

const convertButton=document.getElementById('convert');

const statusText=document.getElementById('status');

const bar=document.getElementById('bar');

const result=document.getElementById('result');

let selectedFile=null;

let ffmpeg=null;

let outputUrl=null;

fileInput.addEventListener('change',()=>{

 selectedFile=fileInput.files[0];

 if(!selectedFile)return;

 document.getElementById('fileTitle').textContent=selectedFile.name;

 document.getElementById('fileInfo').textContent=

  (selectedFile.size/1024/1024).toFixed(1)+' MB';

 convertButton.disabled=false;

 result.style.display='none';

 statusText.textContent='Datei bereit zur Umwandlung.';

 bar.style.width='0%';

});

convertButton.addEventListener('click',async()=>{

 if(!selectedFile)return;

 convertButton.disabled=true;

 result.style.display='none';

 bar.style.width='0%';

 try{

  statusText.textContent='Konverter wird geladen ...';

  if(!ffmpeg){

   const {FFmpeg}=await import(

    'https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js'

   );

   const {toBlobURL}=await import(

    'https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.2/dist/esm/index.js'

   );

   ffmpeg=new FFmpeg();

   ffmpeg.on('progress',({progress})=>{

    const percent=Math.max(0,Math.min(100,Math.round(progress*100)));

    bar.style.width=percent+'%';

    statusText.textContent='Umwandlung läuft: '+percent+'%';

   });

   const base='https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/umd';

   await ffmpeg.load({

    coreURL:await toBlobURL(base+'/ffmpeg-core.js','text/javascript'),

    wasmURL:await toBlobURL(base+'/ffmpeg-core.wasm','application/wasm')

   });

  }

  statusText.textContent='Videodatei wird vorbereitet ...';

  const inputName='input.mp4';

  const outputName='audio.mp3';

  await ffmpeg.writeFile(inputName,new Uint8Array(await selectedFile.arrayBuffer()));

  statusText.textContent='Audio wird umgewandelt ...';

  const exitCode=await ffmpeg.exec([

   '-i',inputName,

   '-vn',

   '-codec:a','libmp3lame',

   '-b:a',document.getElementById('quality').value,

   outputName

  ]);

  if(exitCode!==0)throw new Error('Die Umwandlung ist fehlgeschlagen.');

  const data=await ffmpeg.readFile(outputName);

  const blob=new Blob([data],{type:'audio/mpeg'});

  if(outputUrl)URL.revokeObjectURL(outputUrl);

  outputUrl=URL.createObjectURL(blob);

  const link=document.getElementById('download');

  const original=selectedFile.name.replace(/\.[^/.]+$/,'');

  link.href=outputUrl;

  link.download=original+'.mp3';

  result.style.display='block';

  bar.style.width='100%';

  statusText.textContent='Fertig! Deine MP3 ist bereit.';

 }catch(error){

  console.error(error);

  statusText.textContent='Fehler: '+(error.message||'Konverter konnte nicht geladen werden.');

 }finally{

  convertButton.disabled=false;

 }

});

</script>

</body>

</html>
